name: Deploy Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-workers
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Deploy to Cloudflare (3iatlasgame.xyz)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PROJECT_NAME: 3i-atlas-the-game
          SITE_DOMAIN: 3iatlasgame.xyz
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set."
            echo "Add it in Settings → Secrets and variables → Actions."
            echo "The token needs Account.Workers Scripts Edit + Zone.DNS Edit + Zone.Zone Read."
            exit 1
          fi
          node scripts/deploy-cloudflare.mjs
